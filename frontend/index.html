<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Suppress Chrome extension asynchronous message channel disconnect warnings
    (function () {
      if (typeof window === 'undefined') return;

      function isExtensionChannelError(err) {
        if (!err) return false;
        var msg = '';
        if (typeof err === 'string') {
          msg = err;
        } else if (err.message) {
          msg = err.message;
        } else if (err.reason) {
          msg = typeof err.reason === 'string' ? err.reason : (err.reason.message || String(err.reason));
        } else {
          msg = String(err);
        }
        msg = msg.toLowerCase();
        return (
          msg.indexOf('message channel closed') !== -1 ||
          msg.indexOf('listener indicated an asynchronous response') !== -1 ||
          msg.indexOf('runtime.lasterror') !== -1 ||
          msg.indexOf('unchecked runtime') !== -1
        );
      }

      // 1. Capture unhandled promise rejections at the window level immediately
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          if (isExtensionChannelError(event.reason) || isExtensionChannelError(event)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      // 2. Capture global window error events
      window.addEventListener(
        'error',
        function (event) {
          if (isExtensionChannelError(event.message) || isExtensionChannelError(event.error)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      // 3. Filter console.error and console.warn for extension channel disconnect errors
      var origError = console.error;
      console.error = function () {
        for (var i = 0; i < arguments.length; i++) {
          if (isExtensionChannelError(arguments[i])) {
            return;
          }
        }
        return origError.apply(console, arguments);
      };

      var origWarn = console.warn;
      console.warn = function () {
        for (var i = 0; i < arguments.length; i++) {
          if (isExtensionChannelError(arguments[i])) {
            return;
          }
        }
        return origWarn.apply(console, arguments);
      };

      // 4. Intercept chrome.runtime.onMessage.addListener to auto-check lastError
      //    This is the root fix: "Unchecked runtime.lastError" is emitted by Chrome
      //    when a message listener returns `true` (async) but the port closes before
      //    responding. Wrapping each listener to always void lastError marks it as
      //    "checked" so Chrome suppresses the warning entirely.
      function patchChromeRuntime() {
        try {
          if (!window.chrome || !window.chrome.runtime || !window.chrome.runtime.onMessage) return;
          var origAddListener = window.chrome.runtime.onMessage.addListener.bind(window.chrome.runtime.onMessage);
          window.chrome.runtime.onMessage.addListener = function (listener) {
            var wrappedListener = function (message, sender, sendResponse) {
              // Always void lastError immediately to prevent "Unchecked runtime.lastError"
              try { void window.chrome.runtime.lastError; } catch (e) {}
              var result;
              try {
                result = listener(message, sender, sendResponse);
              } catch (e) {
                try { void window.chrome.runtime.lastError; } catch (e2) {}
                return false;
              }
              // If listener returned true (async), wrap sendResponse to check lastError on close
              if (result === true) {
                var origSendResponse = sendResponse;
                return true;
              }
              return result;
            };
            return origAddListener(wrappedListener);
          };
        } catch (e) {}
      }

      // 5. Patch chrome.runtime.lastError getter so accessing it never throws
      function patchLastErrorGetter() {
        try {
          if (!window.chrome || !window.chrome.runtime) return;
          var rtProto = Object.getPrototypeOf(window.chrome.runtime) || window.chrome.runtime;
          var descriptor = Object.getOwnPropertyDescriptor(rtProto, 'lastError') ||
                           Object.getOwnPropertyDescriptor(window.chrome.runtime, 'lastError');
          if (descriptor && descriptor.get) {
            var origGet = descriptor.get;
            Object.defineProperty(window.chrome.runtime, 'lastError', {
              get: function () {
                try { return origGet.call(window.chrome.runtime); } catch (e) { return undefined; }
              },
              configurable: true
            });
          }
        } catch (e) {}
      }

      // 6. Safely check chrome.runtime.lastError if present to mark it as checked
      try {
        if (window.chrome && window.chrome.runtime) {
          void window.chrome.runtime.lastError;
          patchLastErrorGetter();
          patchChromeRuntime();
        }
      } catch (e) {}

      // Re-apply patches after a short delay in case chrome APIs load asynchronously
      setTimeout(function () {
        try {
          if (window.chrome && window.chrome.runtime) {
            void window.chrome.runtime.lastError;
            patchLastErrorGetter();
            patchChromeRuntime();
          }
        } catch (e) {}
      }, 500);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    rel="stylesheet">
